# BlueTalk v2 release pipeline.
#
# Benoetigte Repository-Secrets:
#   TAURI_SIGNING_PRIVATE_KEY          Inhalt von ~/.tauri/bluetalk-v2.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD Passwort des Schluessels
#
# tauri-action baut den NSIS-Installer, signiert die Updater-Artefakte und
# haengt Installer + .sig + latest.json an das GitHub-Release an. Der in
# tauri.conf.json konfigurierte Endpoint zeigt auf
# .../releases/latest/download/latest.json.
name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BlueTalk ${{ github.ref_name }}'
          releaseBody: 'Siehe Release-Notes.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
