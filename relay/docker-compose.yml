# Beispiel zum Selbsthosten. Reverse-Proxy (Caddy/nginx/Traefik) davor:
# WebSocket-Upgrade und TLS (wss://) dort erledigen.
#
#   # im Repo-Root:
#   docker compose -f relay/docker-compose.yml up -d --build
#   # oder: cd relay && docker compose up -d --build
#
# Build-Kontext ist das Repo-Root (BlueTalk Web + Relay).

services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    image: bluetalk-relay:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      WEB_DIR: /srv/web
      ACCOUNTS_ENABLED: "1"
      SYNC_QUOTA_BYTES: "268435456"
      # Host, den Clients in der Auth-Signatur verwenden (ohne https://).
      # PUBLIC_HOST: bt.example.com
      TRUST_PROXY: "1"
      # Hinter Cloudflare die echte Client-IP (hat Vorrang vor TRUST_PROXY):
      CLIENT_IP_HEADER: cf-connecting-ip
      MAX_CONNECTIONS_PER_IP: "32"
      RUST_LOG: info
    volumes:
      - relay-data:/data

volumes:
  relay-data:
