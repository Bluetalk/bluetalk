[package]
name = "bluetalk-network"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Authenticated, encrypted peer networking core for BlueTalk v2"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.2"
getrandom = "0.3"
hex = "0.4"
hkdf = "0.12"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

